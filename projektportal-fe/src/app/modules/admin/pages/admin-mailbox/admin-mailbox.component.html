<app-admin-page-layout>
  <div class="admin-pages-mailbox__main">
    <h1>mailbox</h1>
    <app-shared-table
      [columns]="mailboxTableColumns()"
      [data]="mailboxData()"
    ></app-shared-table>
    @if (edit()) {
      <h2>Edit existing entry</h2>
    } @else {
      <h2>Create new entry</h2>
    }
    <app-shared-form
      [formSections]="mailboxFormSections()"
      [formData]="mailboxFormData()"
      [formComponentEmitters]="[mailboxFormValueChangeEmitter]"
      (formDataEmitter)="mailboxFormValueChanged($event)"
      (formSubmitEmitter)="mailboxFormSubmitted()"
    ></app-shared-form>
  </div>
</app-admin-page-layout>
