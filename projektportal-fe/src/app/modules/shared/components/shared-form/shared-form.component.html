<form #formReference (submit)="submitButtonPressed($event)" (change)="formChange($event)">
  <div class="row">
    @for (formSection of formSections(); track formSection) {
      @if (isFormSectionActive(formSection)) {
        <fieldset
          class="form--section"
          [ngClass]="calculateBootstrapWidthForFormSection(formSection)"
        >
          @if (formSection.title) {
            <legend>{{formSection.title}}</legend>
          }
          <div class="row">
            @for (formField of formSection.formFields; track formField) {
              <div
                [ngClass]="calculateBootstrapWidthForFormElement(formField)"
                class="form--element"
              >
                <div>
                  <app-shared-dynamic
                    [dynamicComponent]="getDynamicComponent(formField)"
                  ></app-shared-dynamic>
                </div>
              </div>
            }
          </div>
        </fieldset>
      }
    }
  </div>

  <div class="row">
    <div class="col-md-12">
      @if (hasSubmitButton()) {
        <button
          class="form--submit-button btn btn-primary mb-2"
        >
          {{submitButtonText()}}
        </button>
      }
      @if (hasCancelButton()) {
        <button
          (click)="cancelButtonPressed()"
          class="form--cancel-button btn btn-primary mb-2"
        >
          {{cancelButtonText()}}
        </button>
      }
    </div>
  </div>
</form>
