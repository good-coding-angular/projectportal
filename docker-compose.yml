networks:
  projektportalnetwork:
    ipam:
      driver: default
      config:
        - subnet: "192.168.92.0/24"
services:
  projektportal:
      image: projektportal
      pull_policy: build
      depends_on:
        - "projektportal_db"
      container_name: projektportal-service
      ports:
        - "9080:9080"
        - "9443:9443"
      restart: always
      build:
        context: .
        dockerfile: Dockerfile
      environment:
        - ConnectionString__DefaultConnection=user=root;Password=uoF3och6;database=projektportal;host=projektportal-db;
        - ASPNETCORE_URLS=https://+:9443;http://+:9080
        - ASPNETCORE_HTTPS_PORT=9443
        - ASPNETCORE_ENVIRONMENT=Production
        - ASPNETCORE_Kestrel__Certificates__Default__Password=projektportalcert
        - ASPNETCORE_Kestrel__Certificates__Default__Path=/root/.aspnet/DataProtection-Keys/certificate_fullchain.pfx
      volumes:
        - ./certs:/root/.aspnet/DataProtection-Keys
        - ./files:/app/wwwroot/files
      networks:
        projektportalnetwork:
          ipv4_address: 192.168.92.21
  projektportal_db:
    image: mariadb:latest
    container_name: projektportal-db
    environment:
      MYSQL_ROOT_PASSWORD: uoF3och6
    ports:
      - 3306:3306
    restart: always
    volumes:
      - ./database:/var/lib/mysql
    networks:
      projektportalnetwork:
        ipv4_address: 192.168.92.22
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: projektportal_auth
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://projektportal-db:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password123
    ports:
      - "8080:8180"
    depends_on:
      - projektportal_db
    networks:
      projektportalnetwork:
        ipv4_address: 192.168.92.23